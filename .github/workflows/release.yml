name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin,  suffix: macos-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, suffix: linux-arm64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x64, ext: ".zip" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin dribble

      - name: Test (native targets, not Windows)
        # Windows daemon IPC is still a stub; integration tests can
        # deadlock there. Windows ships CLI-only until the overlay lands.
        if: ${{ !matrix.cross && matrix.os != 'windows-latest' }}
        env:
          DRIBBLE_NO_RENDER: "1"
        run: cargo test --workspace

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="dribble-$VERSION-${{ matrix.suffix }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/dribble" "$STAGE/"
          cp installer/install.sh "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" >> SHA256SUMS

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = ${env:GITHUB_REF_NAME}
          $STAGE = "dribble-$VERSION-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dribble.exe" $STAGE/
          Compress-Archive -Path $STAGE -DestinationPath "$STAGE.zip"
          $hash = (Get-FileHash "$STAGE.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $STAGE.zip" | Out-File -Append -Encoding ascii SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: |
            dribble-*
            SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Merge checksums
        run: cat SHA256SUMS 2>/dev/null | sort -u > SHA256SUMS.final || true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dribble-*.tar.gz
            dribble-*.zip
            SHA256SUMS.final
        # published under both names so old installers keep working
          generate_release_notes: true
