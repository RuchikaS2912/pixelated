[package]
name = "wremind-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dribble background daemon"

[dependencies]
wremind-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSResponder",
    "NSEvent",
    "NSGraphicsContext",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSObjCRuntime",
    "NSThread",
    "NSTimer",
] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
